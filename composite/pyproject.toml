[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "composite"
version = "0.1.0"
description = "Depth-aware compositing of rendered robot arms into inpainted egocentric scenes"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8.0",
  "tyro>=1.0.15",
  "loguru>=0.7.3",
]

[project.scripts]
composite = "composite.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["composite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
exclude = ["pkgs", ".venv", "build", "dist"]
line-length = 88
lint.extend-ignore = ["E203", "E266", "E501"]
