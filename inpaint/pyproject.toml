[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inpaint"
version = "0.1.0"
description = "Hand/arm removal inpainting for EgoDataPipe segment outputs (Qwen-Image-Edit, LaMa and ProPainter backends)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "opencv-python>=4.8.0",
  "pillow>=10.0.0",
  "tyro>=1.0.13",
  "loguru>=0.7.3",
  "safetensors>=0.4.0",
  "comfy-kitchen==0.2.31",
  "diffusers>=0.36.0",
  "torch==2.10.0+cu128",
  "torchvision==0.25.0+cu128",
  "transformers>=4.40.0,<5.0.0",
  "accelerate>=0.28.0",
  "huggingface-hub",
  # Third-party TorchScript big-lama wrapper (the LaMa backend). Its
  # pillow<10 requirement is overridden in [tool.uv] to keep pillow>=10.
  "simple-lama-inpainting==0.1.2",
  "propainter>=0.0.4",
]

[project.scripts]
inpaint = "inpaint.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff",
  "uv",
]

[tool.hatch.build.targets.wheel]
packages = ["inpaint"]

[tool.hatch.build.targets.sdist]
packages = ["inpaint"]

[tool.uv]
required-version = ">=0.11.3"
index-strategy = "unsafe-best-match"
# simple-lama-inpainting pins pillow>=9.5,<10.0.0, which contradicts the
# project's pillow>=10.0.0; force pillow up so both can coexist.
override-dependencies = ["pillow>=10.0.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
exclude = ["pkgs", ".venv", "build", "dist", "inpaint/lama_inpaint/_lama"]
line-length = 88
lint.extend-ignore = ["E203", "E266", "E501"]
