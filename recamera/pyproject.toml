[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recamera"
version = "0.1.0"
description = "First-person depth-matched robot arm rendering (transparent background)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "mujoco",
    "open3d>=0.19",
    "imageio>=2.36",
    "pillow>=10.0.0",
    "loguru>=0.7.3",
    "tyro>=1.0.15",
]

[project.scripts]
recamera = "recamera.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["recamera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
